name: Repair flat-layout tests

on:
  push:
    branches:
      - redesign/canvas-workspace-v2

permissions:
  contents: write

jobs:
  repair:
    if: ${{ !contains(github.event.head_commit.message, '[layout-tests-fixed]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remove retired imports from tests
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          workstation = Path('tests/test_workstation_controller.py')
          text = workstation.read_text(encoding='utf-8')
          text = text.replace('from gui.controller import AppController\n', '')
          text = text.replace(
              '    def save_window(self, _window, _workspace=None):\n        pass\n',
              '    def save_window(self, _window):\n        pass\n',
          )
          legacy_test = '''    def test_legacy_app_controller_is_only_an_alias(self):\n        self.assertIs(AppController, WorkstationController)\n        source = inspect.getsource(WorkstationController)\n        self.assertNotIn("class WorkstationController(AppController)", source)\n\n'''
          text = text.replace(legacy_test, '')
          workstation.write_text(text, encoding='utf-8')

          fields = Path('tests/test_gui_fields.py')
          text = fields.read_text(encoding='utf-8')
          text = text.replace(
              '    from gui.controller import AppController, UiMode\n',
              '    from gui.controllers import WorkstationController\n'
              '    from gui.controllers.state import UiMode\n',
          )
          text = text.replace(
              '        def save_window(self, window, splitter):\n            self.saved_window = (window, splitter)\n',
              '        def save_window(self, window):\n            self.saved_window = window\n',
          )
          text = text.replace('controller = AppController(window, settings, task_manager=tasks)', 'controller = WorkstationController(window, settings, task_manager=tasks)')
          fields.write_text(text, encoding='utf-8')

          offenders = []
          for path in Path('tests').rglob('*.py'):
              body = path.read_text(encoding='utf-8')
              if 'gui.controller' in body or 'AppController' in body:
                  offenders.append(str(path))
          if offenders:
              raise SystemExit('retired controller references remain: ' + ', '.join(offenders))
          PY
      - name: Commit repaired tests
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests
          git commit -m "tests: target flat source controller API [layout-tests-fixed]"
          git push origin HEAD:redesign/canvas-workspace-v2
