name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      QT_QPA_PLATFORM: offscreen
      CUDA_VISIBLE_DEVICES: ""
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install test runtime
        run: |
          python -m pip install --upgrade pip
          python -m pip install "PySide6>=6.8,<7" "Pillow>=10,<13"
      - name: Resolve production requirements
        run: python -m pip install --dry-run -r requirements.txt
      - name: Compile
        run: python -m compileall -q main.py sam3_auto_annotator tests
      - name: Unit and offscreen GUI tests
        run: python -m unittest discover -s tests -v
