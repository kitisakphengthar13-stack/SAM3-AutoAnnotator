name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    env:
      QT_QPA_PLATFORM: offscreen
      CUDA_VISIBLE_DEVICES: ""
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONPATH: src
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install Qt runtime libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends libegl1
      - name: Install tested GUI runtime
        run: |
          python -m pip install --upgrade pip
          python -m pip install -c constraints-tested.txt "PySide6>=6.8,<7" "Pillow>=10,<13"
      - name: Resolve tested production requirements
        run: python -m pip install --dry-run -r requirements.txt -c constraints-tested.txt
      - name: Verify Ultralytics SAM API contract
        run: |
          python -m pip install --no-deps -c constraints-tested.txt "ultralytics>=8.4.133,<9"
          python tools/check_ultralytics_contract.py
      - name: Compile
        run: python -m compileall -q src tests tools
      - name: Domain and offscreen GUI suite
        run: python -m unittest discover -s tests -v
      - name: Windows native Qt interaction checks
        if: runner.os == 'Windows'
        env:
          QT_QPA_PLATFORM: windows
        run: python -m unittest discover -s tests -p test_gui_v3_interactions.py -v
      - name: Render workstation screens
        if: success() || failure()
        env:
          QT_QPA_PLATFORM: ${{ runner.os == 'Windows' && 'windows' || 'offscreen' }}
        run: python tools/render_ui.py --output-dir ui-captures
      - name: Render at 150 percent scaling
        if: success() || failure()
        env:
          QT_QPA_PLATFORM: ${{ runner.os == 'Windows' && 'windows' || 'offscreen' }}
          QT_SCALE_FACTOR: "1.5"
        run: python tools/render_ui.py --output-dir ui-captures-150
      - name: Upload rendered UI evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: workstation-ui-${{ runner.os }}
          path: |
            ui-captures/
            ui-captures-150/
          if-no-files-found: ignore
          retention-days: 14
