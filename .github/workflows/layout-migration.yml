name: One-shot layout migration

on:
  push:
    branches:
      - redesign/canvas-workspace-v2

permissions:
  contents: write

jobs:
  migrate:
    if: ${{ !contains(github.event.head_commit.message, '[layout-migrated]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Rewrite repository layout
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import shutil

          root = Path.cwd()
          old = root / "sam3_auto_annotator"
          src = root / "src"
          if not old.is_dir():
              raise SystemExit("expected sam3_auto_annotator/ before migration")
          if src.exists():
              raise SystemExit("src/ already exists; refusing partial migration")

          src.mkdir()

          # Move the real source tree directly under src/. There is intentionally
          # no project-name wrapper package.
          for child in list(old.iterdir()):
              if child.name in {"__init__.py", "application.py"}:
                  continue
              target_name = "domain" if child.name == "core" else child.name
              shutil.move(str(child), str(src / target_name))

          version_text = (old / "__init__.py").read_text(encoding="utf-8")
          version_line = next(
              (line for line in version_text.splitlines() if line.startswith("__version__")),
              '__version__ = "0.0.0"',
          )
          (src / "version.py").write_text(version_line + "\n", encoding="utf-8")

          # One real executable entrypoint. No root wrapper -> application.main -> main chain.
          (src / "main.py").write_text(
              '''from __future__ import annotations\n\nimport logging\nimport sys\nimport traceback\n\nfrom PySide6.QtWidgets import QApplication, QMessageBox\n\nfrom gui.controllers import WorkstationController\nfrom gui.icons import ICONS, icon\nfrom gui.main_window import MainWindow\nfrom gui.settings import UiSettings\nfrom gui.widgets.numeric_field import configure_c_locale\nfrom logging_setup import configure_logging\nfrom version import __version__\n\n\nlogger = logging.getLogger(__name__)\n\n\ndef create_application(argv=None):\n    configure_c_locale()\n    QApplication.setOrganizationName("SAM3-AutoAnnotator")\n    QApplication.setOrganizationDomain("sam3-auto-annotator.local")\n    QApplication.setApplicationName("SAM3 AutoAnnotator")\n    QApplication.setApplicationDisplayName("SAM3 AutoAnnotator")\n    QApplication.setApplicationVersion(__version__)\n\n    app = QApplication.instance() or QApplication(\n        list(sys.argv if argv is None else argv)\n    )\n    app.setWindowIcon(icon(ICONS["app"]))\n    log_path = configure_logging()\n\n    settings = UiSettings()\n    window = MainWindow()\n    WorkstationController(window, settings)\n    window.ui_settings = settings\n    settings.restore_window(window)\n    window.diagnostic_log_path = log_path\n    _install_exception_hook(window, log_path)\n    return app, window\n\n\ndef _install_exception_hook(window, log_path):\n    def handle_exception(error_type, error, tb):\n        detail = "".join(traceback.format_exception(error_type, error, tb))\n        logger.critical("Unhandled GUI exception\\n%s", detail)\n        support_hint = (\n            f"\\n\\nDiagnostic log: {log_path}" if log_path is not None else ""\n        )\n        QMessageBox.critical(\n            window,\n            "Unexpected Error",\n            "The application hit an unexpected error. Your saved project was not "\n            f"modified by this message. Please retry the last action.{support_hint}",\n        )\n\n    sys.excepthook = handle_exception\n\n\ndef run(argv=None):\n    app, window = create_application(argv)\n    window.show()\n    return app.exec()\n\n\nif __name__ == "__main__":\n    raise SystemExit(run())\n''',
              encoding="utf-8",
          )

          shutil.rmtree(old)
          (root / "main.py").unlink()

          # Retired compatibility layer: active code imports focused controllers directly.
          controller_shim = src / "gui" / "controller.py"
          if controller_shim.exists():
              controller_shim.unlink()

          # Test fixtures belong to tests, generated output does not belong in Git.
          old_fixtures = root / "images_test"
          fixture_dir = root / "tests" / "fixtures" / "images"
          fixture_dir.mkdir(parents=True, exist_ok=True)
          if old_fixtures.exists():
              for image in old_fixtures.iterdir():
                  shutil.move(str(image), str(fixture_dir / image.name))
              old_fixtures.rmdir()
          shutil.rmtree(root / "outputs", ignore_errors=True)

          replacements = (
              ("sam3_auto_annotator.application", "main"),
              ("sam3_auto_annotator.core", "domain"),
              ("sam3_auto_annotator.gui", "gui"),
              ("sam3_auto_annotator.sam3", "sam3"),
              ("sam3_auto_annotator.services", "services"),
              ("sam3_auto_annotator.storage", "storage"),
              ("sam3_auto_annotator.app_paths", "app_paths"),
              ("sam3_auto_annotator.logging_setup", "logging_setup"),
              ("from sam3_auto_annotator import __version__", "from version import __version__"),
          )

          for base in (src, root / "tests"):
              for path in base.rglob("*.py"):
                  text = path.read_text(encoding="utf-8")
                  for before, after in replacements:
                      text = text.replace(before, after)
                  text = text.replace(
                      'Path(__file__).resolve().parents[1] / "images_test"',
                      'Path(__file__).resolve().parent / "fixtures" / "images"',
                  )
                  text = text.replace("images_test/car_", "tests/fixtures/images/car_")
                  path.write_text(text, encoding="utf-8")

          # Remove migration-era workspace aliases instead of carrying dead signatures.
          window_path = src / "gui" / "main_window.py"
          text = window_path.read_text(encoding="utf-8")
          text = text.replace("        self.workspace = self.canvas_area\n", "")
          window_path.write_text(text, encoding="utf-8")

          settings_path = src / "gui" / "settings.py"
          text = settings_path.read_text(encoding="utf-8")
          text = text.replace("def restore_window(self, window, _legacy_workspace=None):", "def restore_window(self, window):")
          text = text.replace("def save_window(self, window, _legacy_workspace=None):", "def save_window(self, window):")
          settings_path.write_text(text, encoding="utf-8")

          workstation = src / "gui" / "controllers" / "workstation_controller.py"
          text = workstation.read_text(encoding="utf-8")
          text = text.replace("self.settings.save_window(self.view, self.view.workspace)", "self.settings.save_window(self.view)")
          workstation.write_text(text, encoding="utf-8")

          # Test name follows the domain terminology used by the new source tree.
          old_test = root / "tests" / "test_annotation_core.py"
          if old_test.exists():
              old_test.rename(root / "tests" / "test_annotation_domain.py")

          # CI validates the new tree directly.
          ci = root / ".github" / "workflows" / "ci.yml"
          ci_text = ci.read_text(encoding="utf-8")
          ci_text = ci_text.replace('PYTHONDONTWRITEBYTECODE: "1"', 'PYTHONDONTWRITEBYTECODE: "1"\n      PYTHONPATH: src')
          ci_text = ci_text.replace("python -m compileall -q main.py sam3_auto_annotator tests", "python -m compileall -q src tests")
          ci.write_text(ci_text, encoding="utf-8")

          # Generated directories are created by the app and never tracked.
          gitignore = root / ".gitignore"
          ignore = gitignore.read_text(encoding="utf-8")
          ignore = ignore.replace("outputs/*\n!outputs/.gitkeep\n", "/outputs/\n")
          gitignore.write_text(ignore, encoding="utf-8")

          # Documentation must describe the tree that actually exists.
          for path in [root / "README.md", *list((root / "docs").glob("*.md"))]:
              text = path.read_text(encoding="utf-8")
              text = text.replace("images_test", "tests/fixtures/images")
              text = text.replace("main.py sam3_auto_annotator tests", "src tests")
              text = text.replace("sam3_auto_annotator/", "src/")
              text = text.replace("`main.py`", "`src/main.py`")
              text = text.replace("main.py\n", "src/main.py\n")
              text = text.replace("python.exe main.py", "python.exe src\\main.py")
              text = text.replace("gui/controller.py remains only as a compatibility import alias.", "The retired monolithic controller module has been removed.")
              text = text.replace("`gui/controller.py` contains only a temporary import\nalias (`AppController = WorkstationController`) for callers that still import the\nold module path; it contains no legacy controller implementation.\n\n", "")
              path.write_text(text, encoding="utf-8")

          # Replace README structure block explicitly; broad search/replace is not enough.
          readme = root / "README.md"
          text = readme.read_text(encoding="utf-8")
          start = text.index("## Project structure")
          end = text.index("## Known limitation")
          structure = '''## Project structure\n\n```text\nSAM3-AutoAnnotator/\n|-- src/\n|   |-- main.py                     # executable composition root\n|   |-- app_paths.py\n|   |-- logging_setup.py\n|   |-- version.py\n|   |-- domain/                      # project/annotation rules\n|   |-- services/                    # project, prediction, edit, export use cases\n|   |-- sam3/                        # Ultralytics adapter/result mapping\n|   |-- storage/                     # image/JSON/CSV/YOLO persistence\n|   `-- gui/                         # PySide6 workstation\n|-- tests/\n|   `-- fixtures/images/             # small integration fixtures\n|-- docs/\n|-- requirements.txt\n`-- .gitignore\n```\n\n`src/main.py` is the only executable entrypoint. There is no project-name wrapper\npackage and no root forwarding script. Generated `outputs/` and local `models/`\nare runtime directories ignored by Git.\n\n'''
          readme.write_text(text[:start] + structure + text[end:], encoding="utf-8")

          # Architecture docs get an exact top-level boundary instead of migration history.
          architecture = root / "docs" / "architecture.md"
          text = architecture.read_text(encoding="utf-8")
          marker = "## Application controller composition"
          if marker in text:
              prefix, suffix = text.split(marker, 1)
              top = '''## Top-level boundaries\n\n```text\nsrc/\n|-- main.py                         # executable composition root\n|-- app_paths.py\n|-- logging_setup.py\n|-- version.py\n|-- domain/\n|-- services/\n|-- sam3/\n|-- storage/\n`-- gui/\n    |-- actions.py\n    |-- controllers/\n    |-- coordinators/\n    |-- main_window.py\n    |-- settings.py\n    |-- theme.py\n    |-- undo.py\n    |-- models/\n    |-- rendering/\n    |-- tasks/\n    |-- views/\n    `-- widgets/\n```\n\n`domain`, `services`, `sam3`, and `storage` remain UI-independent. The repository\nhas no project-name wrapper package and no forwarding entrypoint.\n\n'''
              product = prefix.split("## Top-level boundaries")[0]
              text = product + top + marker + suffix
              architecture.write_text(text, encoding="utf-8")

          # No Python source may retain the removed namespace or migration workspace API.
          offenders = []
          for base in (src, root / "tests"):
              for path in base.rglob("*.py"):
                  body = path.read_text(encoding="utf-8")
                  if "sam3_auto_annotator" in body or "_legacy_workspace" in body or ".workspace" in body:
                      offenders.append(str(path))
          if offenders:
              raise SystemExit("legacy references remain: " + ", ".join(offenders))

          # Remove this one-shot workflow from the migrated tree.
          Path(".github/workflows/layout-migration.yml").unlink()
          PY

      - name: Syntax check migrated tree
        run: python -m compileall -q src tests

      - name: Commit migrated layout
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "refactor: migrate application to flat src layout [layout-migrated]"
          git push origin HEAD:redesign/canvas-workspace-v2
