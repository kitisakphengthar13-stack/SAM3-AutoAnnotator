name: One-shot layout migration v2

on:
  push:
    branches:
      - redesign/canvas-workspace-v2

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run corrected migration
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          import textwrap

          workflow = Path('.github/workflows/layout-migration.yml')
          raw = workflow.read_text(encoding='utf-8')
          match = re.search(r"          python - <<'PY'\n(.*?)\n          PY", raw, re.S)
          if match is None:
              raise SystemExit('could not extract migration script')
          script = textwrap.dedent(match.group(1))
          old_guard = 'if "sam3_auto_annotator" in body or "_legacy_workspace" in body or ".workspace" in body:'
          new_guard = '''if (\n                "from sam3_auto_annotator" in body\n                or "import sam3_auto_annotator" in body\n                or "_legacy_workspace" in body\n                or "self.workspace = self.canvas_area" in body\n                or "self.view.workspace" in body\n                or "window.workspace" in body\n            ):'''
          if old_guard not in script:
              raise SystemExit('expected legacy guard not found')
          script = script.replace(old_guard, new_guard)
          exec(compile(script, '<layout-migration>', 'exec'), {'__name__': '__main__'})
          Path('.github/workflows/layout-migration-v2.yml').unlink()
          PY

      - name: Syntax check migrated tree
        run: python -m compileall -q src tests

      - name: Commit migrated layout
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "refactor: migrate application to flat src layout [layout-migrated]"
          git push origin HEAD:redesign/canvas-workspace-v2
